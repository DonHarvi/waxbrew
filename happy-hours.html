<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <link rel="canonical" href="https://waxbrew.com/happy-hours">
  <title>WaxBrew Happy Hours</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/assets/analytics.js"></script>
  <script>gtag('event', 'view_promo_happy_hours', { event_category: 'promo', promo_name: 'happy_hours' });</script>
</head>
<body>

  <div class="page-top">
    <a class="home-link" href="/">← WaxBrew</a>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="sr">SR</button>
      <button class="lang-btn" data-lang="ru">RU</button>
    </div>
  </div>

  <main class="promo-page">
    <div class="promo-brand">WaxBrew Specialty Coffee &amp; Vinyl / Textura</div>
    <div class="promo-label" data-en="Coffee promo" data-sr="Kafa akcija" data-ru="Акция на кофе">Coffee promo</div>
    <h1 class="promo-title" data-en="Happy Hours: 20% Off" data-sr="Happy Hours: 20% popusta" data-ru="Happy Hours: скидка 20%">Happy Hours: 20% Off</h1>
    <p class="promo-copy" data-en="Get 20% off coffee drinks from 14:00 to 16:00 at WaxBrew Textura." data-sr="Dobij 20% popusta na kafu od 14:00 do 16:00 u WaxBrew Textura." data-ru="Скидка 20% на кофе с 14:00 до 16:00 в WaxBrew Textura.">Get 20% off coffee drinks from 14:00 to 16:00 at WaxBrew Textura.</p>
    <p class="promo-terms" data-en="Valid in store only. Applies to coffee drinks during the promo hours." data-sr="Važi samo u lokalu. Odnosi se na kafe tokom promotivnog vremena." data-ru="Действует только в заведении. Распространяется на кофе в указанные часы.">Valid in store only. Applies to coffee drinks during the promo hours.</p>
    <div class="promo-actions">
      <a class="promo-btn primary" href="/menu" data-en="Open Menu" data-sr="Pogledaj meni" data-ru="Открыть меню">Open Menu</a>
      <a class="promo-btn" href="/reviews" data-en="Reviews" data-sr="Recenzije" data-ru="Отзывы">Reviews</a>
      <a class="promo-btn" href="https://maps.app.goo.gl/h6mKg2DzowqLscRg9" data-en="Get Directions" data-sr="Kako doći" data-ru="Как добраться">Get Directions</a>
    </div>
    <p class="promo-address">Prve Proleterske, Budva, Montenegro</p>
  </main>

  <script src="/assets/i18n.js"></script>
</body>
</html>
